# =============================================================================
# Cloud Build CI/CD Configuration for ORANavigator
# =============================================================================
# Automatically builds and deploys on push to main branch
#
# Setup:
#   1. Connect your GitHub repo to Cloud Build
#   2. Create a trigger for pushes to main branch
#   3. Set substitution variables or use Secret Manager
#
# =============================================================================

substitutions:
  _REGION: us-central1
  _REPO_NAME: oranavigator
  _BACKEND_SERVICE: oranavigator-backend
  _FRONTEND_SERVICE: oranavigator-frontend
  _ADK_SERVICE: oranavigator-adk

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # =============================================================================
  # Step 1: Build ADK Agent Image
  # =============================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-adk'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/adk-agent:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/adk-agent:latest'
      - './adk_agent'

  # =============================================================================
  # Step 2: Build Backend Image
  # =============================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/backend:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/backend:latest'
      - './backend'

  # =============================================================================
  # Step 3: Build Frontend Image (runs in parallel with backend)
  # =============================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args:
      - 'build'
      - '--platform=linux/amd64'
      - '--build-arg=VITE_API_BASE_URL='
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/frontend:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/frontend:latest'
      - './frontend'

  # =============================================================================
  # Step 4: Push all images to Artifact Registry
  # =============================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-adk'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/adk-agent']
    waitFor: ['build-adk']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/backend']
    waitFor: ['build-backend']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/frontend']
    waitFor: ['build-frontend']

  # =============================================================================
  # Step 5: Deploy ADK Agent to Cloud Run
  # =============================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-adk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_ADK_SERVICE}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/adk-agent:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--port=8080'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--min-instances=1'
      - '--cpu-boost'
      # IMPORTANT: keep ADK at a SINGLE instance. The ADK service stores agent
      # sessions IN MEMORY (no ADK_SESSION_DB_URI), so with >1 instance a
      # session created on one instance 404s on /run_sse when the next call is
      # routed to another instance ("An error occurred while processing your
      # question"). A brief bump to min/max=2 caused exactly that. Scaling ADK
      # horizontally requires a shared session store first. concurrency=80 lets
      # one warm instance handle demo/normal load fine.
      - '--max-instances=1'
      - '--timeout=300'
      - '--concurrency=80'
      - '--no-allow-unauthenticated'
      - '--service-account=oranavigator-backend@${PROJECT_ID}.iam.gserviceaccount.com'
      - '--set-env-vars=GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${_REGION},GOOGLE_GENAI_USE_VERTEXAI=TRUE,AGENT_MODEL=gemini-2.5-flash,ADK_APP_NAME=ora_navigator_unified,UNIFIED_DATASTORE_ID=projects/${PROJECT_ID}/locations/us/collections/default_collection/dataStores/oranavigator-kb-v8,VERTEX_AI_DATASTORE_ID=projects/${PROJECT_ID}/locations/us/collections/default_collection/dataStores/oranavigator-kb-v8,KB_PREFETCH_DATASTORE_ID=oranavigator-kb-v8'
    waitFor: ['push-adk']

  # =============================================================================
  # Step 6: Get ADK URL and Deploy Backend
  # =============================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        ADK_URL=$(gcloud run services describe ${_ADK_SERVICE} --region=${_REGION} --format='value(status.url)')
        echo "ADK URL: $$ADK_URL"

        # Self-heal: the deploy mounts ora-firecrawl-api-key as a secret. If it does
        # not exist yet (or was created in the wrong project), create it with a
        # placeholder so the deploy never fails on a missing secret. URL scraping
        # degrades gracefully to Jina/proxy until a real key is set via:
        #   printf 'fc-...' | gcloud secrets versions add ora-firecrawl-api-key --data-file=-
        if ! gcloud secrets describe ora-firecrawl-api-key --project=${PROJECT_ID} >/dev/null 2>&1; then
          echo "ora-firecrawl-api-key missing -> creating placeholder"
          printf 'unset' | gcloud secrets create ora-firecrawl-api-key \
            --project=${PROJECT_ID} --replication-policy=automatic --data-file=- || true
        fi
        gcloud secrets add-iam-policy-binding ora-firecrawl-api-key \
          --project=${PROJECT_ID} \
          --member="serviceAccount:oranavigator-backend@${PROJECT_ID}.iam.gserviceaccount.com" \
          --role="roles/secretmanager.secretAccessor" >/dev/null 2>&1 || true

        gcloud run deploy ${_BACKEND_SERVICE} \
          --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/backend:${SHORT_SHA} \
          --region=${_REGION} \
          --platform=managed \
          --port=5000 \
          --memory=1Gi \
          --cpu=1 \
          --min-instances=1 \
          --cpu-boost \
          --max-instances=20 \
          --timeout=300 \
          --concurrency=100 \
          --allow-unauthenticated \
          --service-account=oranavigator-backend@${PROJECT_ID}.iam.gserviceaccount.com \
          --set-env-vars="USE_VERTEX_AGENT=true,ADK_BASE_URL=$$ADK_URL,ADK_APP_NAME=ora_navigator_unified,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${_REGION},GOOGLE_GENAI_USE_VERTEXAI=TRUE,AGENT_MODEL=gemini-2.5-flash,UNIFIED_DATASTORE_ID=projects/${PROJECT_ID}/locations/us/collections/default_collection/dataStores/oranavigator-kb-v8,VERTEX_AI_DATASTORE_ID=projects/${PROJECT_ID}/locations/us/collections/default_collection/dataStores/oranavigator-kb-v8,ALGORITHM=HS256,SMTP_HOST=smtp.gmail.com,SMTP_PORT=587,FROM_EMAIL=oranav@morgan.edu,REPLY_TO=oranav@morgan.edu,APP_URL=https://ora.inavigator.ai,API_URL=https://oranavigator-backend-ollhkgeova-uc.a.run.app,ALLOW_TEST_EMAILS=false,SKIP_EMAIL_VERIFICATION=true,ACCESS_TOKEN_EXPIRE_MINUTES=240,SHOW_DASHBOARD_LOGS=false,CHAT_LATENCY_BUDGET_S=5" \
          --set-secrets="DATABASE_URL=ora-database-url:latest,JWT_SECRET=ora-jwt-secret:latest,ADMIN_EMAIL=ora-admin-email:latest,ADMIN_PASSWORD=ora-admin-password:latest,REDIS_URL=ora-redis-url:latest,FIRECRAWL_API_KEY=ora-firecrawl-api-key:latest,SMTP_USER=SMTP_USER:latest,SMTP_PASS=SMTP_PASS:latest"
        # Email sending (restored 2026-07-28). SMTP_USER/SMTP_PASS come from the
        # SMTP_USER + SMTP_PASS secrets (note: NOT the ora-* naming of the older
        # secrets; the retired ora-smtp secret is gone). SMTP_USER is a Gmail App
        # Password login for a real mailbox — a Google GROUP can never be used here,
        # it has no password.
        #
        # FROM_EMAIL=oranav@morgan.edu makes mail read "ORA Navigator
        # <oranav@morgan.edu>" instead of exposing an individual's mailbox. This only
        # works because Gmail accepts that From for the SMTP_USER account and does NOT
        # rewrite it — VERIFIED 2026-07-28 by sending a live test and inspecting the
        # delivered header. Gmail silently rewrites From to the authenticated account
        # when it disallows the address, so if this address ever changes, re-test by
        # sending and READING the delivered header. An accepted SMTP handshake proves
        # nothing on its own.
        #
        # Do not point FROM_EMAIL at an address unrelated to SMTP_USER (the old config
        # named noreplyinavigator@gmail.com while authenticating as a morgan.edu
        # account) — that is the mismatch this replaced.
        #
        # REPLY_TO needs no verification anywhere, so replies reach the shared group
        # regardless of the send-as alias question.
        #
        # SKIP_EMAIL_VERIFICATION is still true. Flip it to false only AFTER a live
        # send to a non-Morgan address succeeds — _send_email returns True without
        # sending when creds are missing, so a broken setup looks healthy.
        # NOTE: RESEARCH_SECRET (cron auth) is still set manually on the service — the crons
        # (research/memory/deadlines) 403 after every deploy until it's migrated to a secret too:
        #   gcloud run services update oranavigator-backend --update-env-vars="RESEARCH_SECRET=<secret>"
    waitFor: ['deploy-adk', 'push-backend']

  # =============================================================================
  # Step 7: Deploy Frontend to Cloud Run
  # =============================================================================
  # Retries on ABORTED, then VERIFIES what is actually serving.
  #
  # Cloud Run versions each service optimistically: `gcloud run deploy` reads
  # the service, then writes back asserting the version it read. This service
  # carries the ora.inavigator.ai domain mapping, and the mapping controller
  # reconciles independently -- bumping the version underneath an in-flight
  # deploy. Observed 2026-08-06: the deploy created the revision, routed 100%
  # of traffic to it, and THEN exited 1 with
  #   ABORTED: version '<16:49:50>' was specified but current version is '<18:04:07>'
  # A red build that had in fact shipped everything. That is worse than a
  # failure, because the signal now lies in both directions.
  #
  # So: retry the race, then decide the step's exit code on the ONLY thing that
  # matters -- whether the serving revision runs the image this build pushed.
  # Red now means "the deployed image is not ours", and nothing else.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frontend'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -o pipefail
        IMAGE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/frontend:${SHORT_SHA}"

        for attempt in 1 2 3; do
          echo "deploy attempt $$attempt"
          if gcloud run deploy ${_FRONTEND_SERVICE} \
               --image="$$IMAGE" \
               --region=${_REGION} \
               --platform=managed \
               --port=8080 \
               --memory=512Mi \
               --cpu=1 \
               --min-instances=0 \
               --max-instances=10 \
               --timeout=60 \
               --concurrency=200 \
               --allow-unauthenticated; then
            echo "deploy command succeeded"
            break
          fi
          echo "deploy attempt $$attempt failed (likely an ABORTED version race)"
          sleep 10
        done

        # The command's exit code is not evidence. This is.
        WANT=$$(gcloud artifacts docker images describe "$$IMAGE" \
                  --format='value(image_summary.digest)' 2>/dev/null)
        REV=$$(gcloud run services describe ${_FRONTEND_SERVICE} --region=${_REGION} \
                  --format='value(status.latestReadyRevisionName)')
        GOT=$$(gcloud run revisions describe "$$REV" --region=${_REGION} \
                  --format='value(spec.containers[0].image)')

        echo "serving revision : $$REV"
        echo "serving image    : $$GOT"
        echo "expected digest  : $$WANT"

        # Fail closed. An empty digest would make the glob below match anything
        # and turn "we could not check" into a green build -- the exact failure
        # this step exists to remove.
        if [ -z "$$WANT" ] || [ -z "$$REV" ] || [ -z "$$GOT" ]; then
          echo "FAILED: could not read the digest or the serving revision; refusing to pass."
          exit 1
        fi

        case "$$GOT" in
          *"$$WANT"*)
            echo "VERIFIED: the serving revision runs the image this build pushed."
            exit 0 ;;
          *)
            echo "FAILED: the serving revision does NOT run this build's image."
            exit 1 ;;
        esac
    waitFor: ['push-frontend', 'deploy-backend']

  # =============================================================================
  # Step 8: Print deployment summary
  # =============================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'summary'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "========================================="
        echo "Deployment Complete!"
        echo "========================================="
        echo "Frontend: $(gcloud run services describe ${_FRONTEND_SERVICE} --region=${_REGION} --format='value(status.url)')"
        echo "Backend:  $(gcloud run services describe ${_BACKEND_SERVICE} --region=${_REGION} --format='value(status.url)')"
        echo "ADK:      $(gcloud run services describe ${_ADK_SERVICE} --region=${_REGION} --format='value(status.url)')"
        echo "========================================="
    waitFor: ['deploy-frontend']

# Images to store in Artifact Registry
images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/adk-agent:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/adk-agent:latest'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/backend:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/backend:latest'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/frontend:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/frontend:latest'

timeout: 1800s
